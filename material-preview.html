<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>立體牌代表樣本 v0.23</title><style>*{box-sizing:border-box}body{margin:0;background:#15251e;color:#f5e5c5;font:16px/1.6 "Microsoft JhengHei",sans-serif}main{max-width:1100px;margin:auto;padding:24px}h1{font-size:26px}p{color:#c3c4b1}a{color:#f1c777}.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px}figure{margin:0;border:1px solid #71816a;border-radius:10px;background:#234832;padding:12px}figure img{display:block;width:100%;height:220px;object-fit:contain}figcaption{margin-top:8px}.compare{display:flex;align-items:flex-end;gap:8px;flex-wrap:wrap}.sample{width:65px;height:86px;display:flex;flex-direction:column;justify-content:flex-end}.sample svg,.sample img{display:block;width:100%;height:auto;max-height:100%;object-fit:contain}.row{display:flex;gap:0;align-items:flex-end;border:1px solid #586e51;padding:10px;margin:12px 0;width:max-content;max-width:100%;overflow:auto}.row .sample{width:34px;height:50px;flex:none}.old{height:76px;object-fit:contain}.notes{font-size:14px}@media(max-width:650px){.grid{grid-template-columns:repeat(2,minmax(0,1fr))}figure img{height:180px}}</style></head><body><main><a href="/?scene=normal&amp;case=review&amp;auto=1">回到可玩牌桌</a><h1>立體牌代表樣本</h1><p>沿用原本的象牙色牌身與深綠雙櫻桃。立起暗牌、躺著的牌牆及明牌分別製作；牌面圖案仍使用已確認的原 PNG。</p><div class="grid">
<figure><img src="./assets/depth-v23/standing-front.png" alt="立起的對家牌背"><figcaption>立起牌背 · 正面</figcaption></figure>
<figure><img src="./assets/depth-v23/standing-side.png" alt="側向立起牌背"><figcaption>立起牌背 · 側向</figcaption></figure>
<figure><img src="./assets/depth-v23/wall-flat.png" alt="平躺的牌背"><figcaption>平躺牌背 · 供雙層牌牆組合</figcaption></figure>
<figure><img src="./assets/depth-v23/face-flat.png" alt="平躺的空白牌身"><figcaption>平躺明牌 · 原圖案另行投影</figcaption></figure></div>
<h2>原版與桌上躺牌比較</h2><div class="compare" id="compare"></div><h2>實際小尺寸</h2><div class="row" id="small"></div>
<p class="notes">本輪是四張代表候選，PNG 原檔未裁切或改寫。桌上圖案以相機透視投影到平坦表面，保留原筆鋒與色彩。側向另一邊目前使用鏡像樣本，光源仍需精修；這是靜態分件試作，完整座位角度、動作及正式美術驗收仍在後續。</p>
</main><script type="module">import {flatFace,standingBack,flatBack} from './table-views.mjs';
const tiles=['1z','7z','1p','5p','1s','8s'];
document.getElementById('compare').innerHTML=tiles.map(t=>'<div class="sample"><img class="old" src="./assets/tile-art/'+t+'.png" alt="'+t+'原版"></div><div class="sample">'+flatFace(t)+'</div>').join('');
document.getElementById('small').innerHTML=[standingBack(2),standingBack(3),flatBack(),...tiles.map(t=>flatFace(t))].map(s=>'<div class="sample">'+s+'</div>').join('');
</script></body></html>
