<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>角色演出測試台｜蜜蜜麻將</title><link rel="stylesheet" href="./ui.css"><link rel="stylesheet" href="./game-layout.css"><link rel="stylesheet" href="./character-lab.css"></head>
<body class="character-lab"><div class="lab-shell">
<header class="lab-header"><div><span class="eyebrow">MIMI · CHARACTER LAB</span><h1>角色演出測試台</h1><p>直接試播，對照實際牌桌比例與動作節奏。</p></div><a href="./">返回正式牌桌</a></header>
<nav id="cast-list" class="cast-list" aria-label="選擇預覽角色"></nav>
<div class="lab-grid"><section class="lab-main"><div class="panel-heading"><h2>牌桌效果</h2><label>預覽座位 <select id="seat"><option value="2">對家</option><option value="3">左家</option><option value="1">右家</option></select></label></div>
<div id="stage-window"><div id="game-shell"><div id="table"><canvas id="table-canvas" aria-hidden="true"></canvas><div id="north" class="seat north"></div><div id="west" class="seat west"></div><div id="east" class="seat east"></div></div><div id="lab-hand"></div><div class="lab-stage-label">演出預覽 · 牌局不會推進</div><div id="stage-loading" role="status">正在載入牌桌…</div></div></div>
<div class="transport"><button id="play" class="primary">重新播放</button><button id="pause">暫停</button><button id="previous" aria-label="上一格">◀ 上一格</button><button id="next" aria-label="下一格">下一格 ▶</button><button id="reset">回到待機</button></div>
<label class="timeline-label" for="timeline">播放位置 <output id="time">0 / 0 ms</output></label><input id="timeline" type="range" min="0" max="1000" value="0" aria-label="播放位置"><div id="playback-state" role="status">載入中</div>
</section>
<aside class="lab-side"><div class="panel-heading"><h2>放大檢查</h2><select id="backdrop" aria-label="放大檢查背景"><option value="checker">透明格</option><option value="felt">桌面綠</option><option value="light">淺色</option><option value="dark">深色</option></select></div><div id="solo" data-background="checker"><img id="solo-image" alt="角色靜態圖"><canvas id="solo-canvas" width="270" height="336" aria-label="角色動作放大預覽" hidden></canvas></div><p id="asset-state" role="status">載入中</p></aside></div>
<section class="win-lab" id="win-lab" aria-label="胡牌演出預覽"><div class="panel-heading"><h2>胡牌演出 · <span id="wl-who"></span></h2><span class="muted">選角色用上方名單；點預覽畫面可跳過演出</span></div>
<div class="wl-controls"><div id="wl-kind" class="action-list"><button data-kind="hu">一般胡</button><button data-kind="tsumo">自摸</button></div>
<label>自摸動畫版面 <select id="wl-layout"><option value="C">C 中間登場→邊動邊滑到左</option><option value="B">B 靠左（接結算不跳）</option><option value="A">A 置中</option></select></label>
<label>「自摸」蓋字時間（ms） <input id="wl-stamp-ms" type="number" min="0" max="6000" step="50" value="2600"></label>
<label><input id="wl-sound" type="checkbox" checked> 影片聲音</label><button id="wl-play" class="primary">重新播放</button></div>
<div id="wl-window"><div id="wl-stage"><img class="wl-table" src="./assets/win-v1/lab-table.webp" alt=""><div class="wl-dim"></div><canvas id="wl-video" hidden></canvas>
<div id="wl-stamp" class="wl-stamp"><img src="./assets/win-v1/brush-hu.png" alt=""><span id="wl-stamp-text">胡</span></div><div id="wl-caption" class="wl-caption"></div>
<div class="wl-settle"><div class="wl-band"></div><img id="wl-portrait" class="wl-portrait" alt=""><div class="wl-panel"><h3 id="wl-title"></h3><div class="wl-tiles" aria-hidden="true"></div><div id="wl-rows"></div></div><div class="wl-seal"><img src="./assets/win-v1/seal-frame.png" alt=""><b id="wl-seal-n">1</b><small>台</small></div></div>
<div class="wl-label">示意 · 背景為牌桌截圖，結算為簡化版</div></div></div>
<p id="wl-state" class="muted" role="status"></p>
<div class="wl-compare"><figure><img id="wl-hu-img" alt="胡牌立繪"><figcaption>一般胡立繪</figcaption></figure><figure><img id="wl-burst-img" alt="自摸爆發立繪"><figcaption>自摸／大牌立繪 · <span id="wl-anim-note"></span></figcaption></figure></div>
<video id="wl-video-src" playsinline preload="auto" hidden></video></section>
<section class="lab-settings"><div><h2>動作</h2><div id="action-list" class="action-list" aria-label="選擇演出動作"></div><div id="idle-options" class="action-list" aria-label="待機小動作" hidden><button data-idle="auto">自然隨機</button><button data-idle="blink">眨眼</button><button data-idle="look" disabled>低頭看牌</button><button data-idle="apron" disabled>整理圍裙</button><button data-idle="tilt">歪頭微笑</button></div><p class="muted" id="action-note"></p></div>
<div class="settings-grid"><label>播放版本 <select id="mode"><option value="live">正式遊戲節奏</option><option value="source">素材原速</option></select></label><label>預覽速度 <select id="speed"><option value="0.5">0.5×</option><option value="0.75">0.75×</option><option value="1" selected>1× 正常</option><option value="1.25">1.25×</option><option value="1.5">1.5×</option><option value="2">2×</option></select></label><label>動作長度（ms） <input id="duration" type="number" min="250" max="8000" step="50" value="4000"></label><label><input id="voice" type="checkbox" checked> 播放日文語音（自然語速）</label><label><input id="repeat" type="checkbox"> 自動重播 · 間隔 1 秒</label><button id="voice-only">只聽本句語音</button><button id="sequence">依序試播 吃 → 碰 → 槓 → 聽</button><button id="defaults">恢復正式設定</button></div>
<p class="muted">調速與長度僅影響這個測試台。語音保持自然速度；暫停或拖曳不會重新喊話。角色尚未製作的動作會標示為待製作。</p></section>
<footer>v0.99 · 使用正式牌桌繪製、角色素材與動作播放器；此頁不讀寫你的牌局與遊戲設定。</footer></div><script type="module" src="./character-lab.mjs"></script><script type="module" src="./win-lab.mjs"></script></body></html>
